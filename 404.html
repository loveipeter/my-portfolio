<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10231B" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found — Peter Lovei</title>
    <!--
      Served by GitHub Pages for any unmatched path. CRA copies files other than
      index.html verbatim, so this page is deliberately self-contained: inline
      styles and an inline mark, no dependency on the hashed CSS bundle.
    -->
    <style>
      :root {
        --mint: #abffd6;
        --mint-soft: #d8fff0;
        --mint-deep: #0f7a52;
        --ink: #10231b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(1.25rem, 5vw, 3rem);
        background: var(--ink);
        color: var(--mint-soft);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        max-width: 34rem;
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.75rem;
        display: block;
      }

      .code {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--mint);
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.5rem);
        line-height: 1.2;
        letter-spacing: -0.015em;
        color: #fff;
        text-wrap: balance;
      }

      p {
        margin: 1rem 0 0;
        color: rgba(216, 255, 240, 0.75);
      }

      .home {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.7rem 1.4rem;
        background: var(--mint);
        color: var(--ink);
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
      }

      .home:hover {
        background: #fff;
      }

      .home:focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <svg
        class="mark"
        viewBox="0 0 64 64"
        role="img"
        aria-label="Peter Lovei"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect width="64" height="64" rx="15" fill="#ABFFD6" />
        <path
          transform="translate(8 6) scale(2)"
          fill="#10231B"
          d="M12 21s-7-4.35-9.5-8.5C.5 9 2.5 5 6.5 5 9 5 12 7.5 12 7.5S15 5 17.5 5c4 0 6 4 4 7.5C19 16.65 12 21 12 21z"
        />
        <path
          d="M15 32 H21 L25 24 L31 41 L36 30 H49"
          fill="none"
          stroke="#ABFFD6"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <p class="code">Error 404</p>
      <h1>This page has flatlined</h1>
      <p>
        The address you followed doesn't exist on this site — it may have moved,
        or the link may have been mistyped.
      </p>

      <a class="home" href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
